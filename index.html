<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CatchTrack</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="user">
    <div id="authPanel" class="auth-shell">
      <div class="auth-card">
        <h2>CatchTrack</h2>
        <p class="subtle">Bitte anmelden, um die Anwendung zu nutzen.</p>

        <div class="form-grid">
          <div class="form-field">
            <label for="loginUsername">Benutzername</label>
            <input id="loginUsername" type="text" value="developer" />
          </div>
          <div class="form-field">
            <label for="loginPassword">Passwort</label>
            <input id="loginPassword" type="password" value="" />
          </div>
          <div class="form-field">
            <label for="developerPassword">Developer-Vorschaupasswort</label>
            <input id="developerPassword" type="password" placeholder="optionales Vorschaupasswort" />
          </div>
          <div class="action-list">
            <button id="setPasswordBtn" class="secondary" type="button">Passwort setzen</button>
            <button id="loginBtn" class="primary" type="button">Anmelden</button>
          </div>
          <div id="authMessage" class="message info">Lokaler Vorschau-Login für Entwicklung und Test.</div>
        </div>
      </div>
    </div>

    <div id="appShell" class="app-shell hidden">
      <aside class="sidebar">
        <div class="brand-box">
          <div class="brand-mark">C</div>
          <div>
            <div class="brand-name">CatchTrack</div>
            <div class="brand-subtitle">User App</div>
          </div>
        </div>

        <div class="user-card">
          <div id="currentUserInitial" class="avatar">D</div>
          <div class="user-meta">
            <div id="currentUserName" class="user-name">Developer</div>
            <div class="user-id" data-user-display-id>USR-000001</div>
          </div>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Bereiche</div>
          <div id="userMenu" class="nav-list"></div>
        </div>

        <div id="adminSection" class="nav-section hidden">
          <div class="nav-section-title">Administration</div>
          <div id="adminMenu" class="nav-list"></div>
        </div>

        <div id="developerSection" class="nav-section hidden">
          <div class="nav-section-title">Developer</div>
          <div id="developerMenu" class="nav-list"></div>
        </div>
      </aside>

      <main class="main-panel">
        <div class="topbar">
          <div class="topbar-title">CatchTrack</div>
          <div class="header-actions">
            <span id="summaryRoleBadge" class="role-badge developer" data-user-role="developer">developer</span>
            <button id="profileBtn" class="ghost" type="button">Profil</button>
            <button id="logoutBtn" class="secondary" type="button">Logout</button>
          </div>
        </div>

        <div class="summary-row">
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Angemeldeter Benutzer</h2>
            </div>
            <div class="user-summary">
              <div>
                <div id="summaryUsername" class="summary-username">Developer</div>
                <div class="small-muted" data-user-display-id>USR-000001</div>
              </div>
              <span id="summaryStatus" class="status-badge ok">active</span>
            </div>
          </div>
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Modules</h2>
            </div>
            <div id="activeModules" class="chip-list"><span class="chip">Anwendung bereit</span></div>
          </div>
        </div>

        <div id="mainContent" class="content-wrap"></div>
      </main>
    </div>

    <script src="Core/core.js"></script>
    <script src="Core/core-event-bus.js"></script>
    <script src="Core/core-error-handler.js"></script>
    <script src="Core/error-log.js"></script>
    <script src="Core/core-config.js"></script>
    <script src="Core/core-context.js"></script>
    <script src="Core/core-lifecycle.js"></script>
    <script src="Core/core-state.js"></script>
    <script src="Core/core-storage.js"></script>
    <script src="Core/module-interface.js"></script>
    <script src="Core/module-registry.js"></script>
    <script src="Core/module-manager.js"></script>
    <script src="Core/core-loader.js"></script>
    <script src="Core/config-manager.js"></script>
    <script src="Core/database-manager.js"></script>
    <script src="Core/security.js"></script>
    <script src="Core/core-auth.js"></script>
    <script src="Core/core-access.js"></script>
    <script src="Core/core-audit.js"></script>
    <script src="Core/core-event-ring.js"></script>
    <script src="Core/core-user.js"></script>
    <script src="Core/core-admin.js"></script>
    <script src="Core/service-manager.js"></script>
    <script src="Core/core-startup.js"></script>
    <script src="Core/core-runtime.js"></script>
    <script src="Core/core-entry.js"></script>
    <script src="Core/app.js"></script>
    <script src="master-ui.js"></script>
  </body>
</html>
