<section
    id="waters-module"
    class="waters-module"
    aria-labelledby="waters-title"
>
    <header class="waters-header">
        <div>
            <p class="waters-eyebrow">CatchTrack</p>
            <h1 id="waters-title">Gewässer</h1>
            <p
                id="waters-status"
                class="waters-status"
                role="status"
                aria-live="polite"
            >
                Gewässer werden geladen …
            </p>
        </div>

        <button
            id="waters-refresh-button"
            class="waters-button waters-button-secondary"
            type="button"
        >
            Aktualisieren
        </button>
    </header>

    <main class="waters-content">

        <section
            class="waters-panel"
            aria-labelledby="waters-location-title"
        >
            <div class="waters-panel-header">
                <div>
                    <p class="waters-section-label">Standort</p>
                    <h2 id="waters-location-title">
                        Aktueller Standort
                    </h2>
                </div>

                <button
                    id="waters-gps-button"
                    class="waters-button waters-button-secondary"
                    type="button"
                >
                    Standort ermitteln
                </button>
            </div>

            <div
                id="waters-gps-status"
                class="waters-message"
                role="status"
                aria-live="polite"
            ></div>

            <div
                id="waters-current-position"
                class="waters-current-position"
                hidden
            ></div>
        </section>

        <section
            class="waters-panel"
            aria-labelledby="waters-form-title"
        >
            <div class="waters-panel-header">
                <div>
                    <p class="waters-section-label">Fangplatz</p>
                    <h2 id="waters-form-title">
                        Fangplatz erfassen
                    </h2>
                </div>
            </div>

            <form
                id="waters-form"
                class="waters-form"
                novalidate
            >
                <input
                    id="waters-id"
                    name="id"
                    type="hidden"
                >

                <div class="waters-form-grid">

                    <div class="waters-field waters-field-full">
                        <label for="waters-name">
                            Gewässername
                        </label>

                        <input
                            id="waters-name"
                            name="name"
                            type="text"
                            maxlength="150"
                            autocomplete="off"
                            required
                        >
                    </div>

                    <div class="waters-field">
                        <label for="waters-type">
                            Gewässertyp
                        </label>

                        <input
                            id="waters-type"
                            name="type"
                            type="text"
                            maxlength="100"
                            autocomplete="off"
                            placeholder="z. B. Fluss, See, Kanal"
                        >
                    </div>

                    <div class="waters-field">
                        <label for="waters-country">
                            Land
                        </label>

                        <input
                            id="waters-country"
                            name="country"
                            type="text"
                            maxlength="100"
                            readonly
                        >
                    </div>

                    <div class="waters-field">
                        <label for="waters-region">
                            Provinz / Bundesstaat
                        </label>

                        <input
                            id="waters-region"
                            name="region"
                            type="text"
                            maxlength="150"
                            readonly
                        >
                    </div>

                    <div class="waters-field">
                        <label for="waters-city">
                            Ort
                        </label>

                        <input
                            id="waters-city"
                            name="city"
                            type="text"
                            maxlength="150"
                            readonly
                        >
                    </div>

                    <div class="waters-field waters-field-full">
                        <label for="waters-description">
                            Beschreibung
                        </label>

                        <textarea
                            id="waters-description"
                            name="description"
                            maxlength="2000"
                            rows="4"
                        ></textarea>
                    </div>

                    <div class="waters-field">
                        <label for="waters-latitude">
                            Breitengrad
                        </label>

                        <input
                            id="waters-latitude"
                            name="gps_lat"
                            type="number"
                            min="-90"
                            max="90"
                            step="any"
                            readonly
                        >
                    </div>

                    <div class="waters-field">
                        <label for="waters-longitude">
                            Längengrad
                        </label>

                        <input
                            id="waters-longitude"
                            name="gps_lon"
                            type="number"
                            min="-180"
                            max="180"
                            step="any"
                            readonly
                        >
                    </div>

                    <div class="waters-field">
                        <label for="waters-accuracy">
                            GPS-Genauigkeit
                        </label>

                        <input
                            id="waters-accuracy"
                            name="gps_accuracy_m"
                            type="text"
                            readonly
                        >
                    </div>

                    <div class="waters-field waters-field-full">
                        <label for="waters-photo">
                            Fangplatz-Foto
                        </label>

                        <input
                            id="waters-photo"
                            name="photo"
                            type="file"
                            accept="image/*"
                        >

                        <p class="waters-help">
                            Ein Foto pro Fangplatz. Beim Upload wird
                            automatisch auf maximal 720 px und WebP
                            mit 70 % Qualität optimiert.
                        </p>

                        <div
                            id="waters-photo-status"
                            class="waters-message"
                            role="status"
                            aria-live="polite"
                        ></div>

                        <div
                            id="waters-photo-preview"
                            class="waters-photo-preview"
                            hidden
                        ></div>
                    </div>

                </div>

                <div
                    id="waters-form-message"
                    class="waters-message"
                    role="alert"
                    aria-live="assertive"
                ></div>

                <div class="waters-form-actions">

                    <button
                        id="waters-save-button"
                        class="waters-button waters-button-primary"
                        type="submit"
                    >
                        Fangplatz speichern
                    </button>

                    <button
                        id="waters-location-button"
                        class="waters-button waters-button-secondary"
                        type="button"
                    >
                        Aktuellen Standort übernehmen
                    </button>

                    <button
                        id="waters-cancel-button"
                        class="waters-button waters-button-secondary"
                        type="button"
                        hidden
                    >
                        Bearbeitung abbrechen
                    </button>

                </div>
            </form>
        </section>

        <section
            class="waters-panel"
            aria-labelledby="waters-list-title"
        >
            <div class="waters-panel-header">
                <div>
                    <p class="waters-section-label">
                        Meine Daten
                    </p>

                    <h2 id="waters-list-title">
                        Meine Fangplätze
                    </h2>
                </div>

                <span
                    id="waters-count"
                    class="waters-count"
                >
                    0
                </span>
            </div>

            <div
                id="waters-list"
                class="waters-list"
                aria-live="polite"
            ></div>
        </section>

    </main>
</section>
