<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo 2</title>
    <link rel="stylesheet" href="../../design/neutral.css" />
  </head>
  <body class="demo-app">
    <main class="demo-app-shell">
      <section class="card">
        <div class="card-header">
          <h1 class="card-title">Demo 2</h1>
        </div>
        <div class="content-wrap">
          <p>This is a separate neutral app instance.</p>
          <p><strong>App ID:</strong> <span id="demo2AppId">loading...</span></p>
          <p><strong>Mount path:</strong> <span id="demo2MountPath">loading...</span></p>
        </div>
      </section>
    </main>
    <script>
      (async () => {
        const response = await fetch('/demo2/api/app-context', { cache: 'no-store' });
        const payload = await response.json();
        const app = payload && payload.app ? payload.app : {};
        document.getElementById('demo2AppId').textContent = app.appId || 'demo2';
        document.getElementById('demo2MountPath').textContent = app.mountPath || '/demo2';
      })();
    </script>
  </body>
</html>
