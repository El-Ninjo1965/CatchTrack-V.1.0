<section class="settings-container">


    <h1>

        Einstellungen

    </h1>





    <div class="settings-card">


        <h2>

            Allgemein

        </h2>





        <label for="settings-language">

            Sprache

        </label>


        <select id="settings-language">


            <option value="de">

                Deutsch

            </option>


            <option value="en">

                English

            </option>


            <option value="th">

                ไทย

            </option>


        </select>





        <label for="settings-theme">

            Darstellung

        </label>


        <select id="settings-theme">


            <option value="light">

                Hell

            </option>


            <option value="dark">

                Dunkel

            </option>


        </select>





        <button

            id="save-settings"

        >

            Speichern

        </button>





        <div id="settings-result">


            <p>

                Bereit.

            </p>


        </div>



    </div>





    <div class="settings-info">


        <h2>

            Erweiterungen

        </h2>


        <ul>


            <li>

                Benutzerprofil

            </li>


            <li>

                Geräteverwaltung

            </li>


            <li>

                Cloud Synchronisation

            </li>


            <li>

                Modulerweiterungen

            </li>


        </ul>


    </div>



</section>
