<section class="fish-database-container">


    <h1>

        Fischdatenbank

    </h1>




    <div class="fish-form-container">


        <h2>

            Neuer Fisch

        </h2>



        <label for="fish-name">

            Name

        </label>


        <input

            type="text"

            id="fish-name"

            placeholder="Fischname"

        >





        <label for="fish-scientific-name">

            Wissenschaftlicher Name

        </label>


        <input

            type="text"

            id="fish-scientific-name"

            placeholder="z.B. Salmo trutta"

        >





        <label for="fish-family">

            Familie

        </label>


        <input

            type="text"

            id="fish-family"

            placeholder="z.B. Salmonidae"

        >





        <label for="fish-description">

            Beschreibung

        </label>


        <textarea

            id="fish-description"

            placeholder="Beschreibung"

        ></textarea>





        <button

            id="save-fish"

        >

            Speichern

        </button>



    </div>






    <div class="fish-list-container">


        <h2>

            Gespeicherte Fische

        </h2>




        <div id="fish-list">


            <p>

                Lade Fischdaten...

            </p>


        </div>


    </div>



</section>
