<section class="catch-container">


    <h1>
        Neuer Fang
    </h1>



    <div class="catch-form">


        <label>
            Fisch auswählen
        </label>


        <select id="catch-fish">

            <option value="">
                Auswahl
            </option>


            <option value="manual">
                Manuell eintragen
            </option>


        </select>



        <div id="manual-fish-container" class="hidden">


            <label>
                Fischname
            </label>


            <input

                id="catch-fish-name"

                type="text"

                placeholder="Fischname eingeben"

            >


        </div>





        <label>
            Gewicht (kg)
        </label>


        <input

            id="catch-weight"

            type="number"

            step="0.01"

        >





        <label>
            Länge (cm)
        </label>


        <input

            id="catch-length"

            type="number"

            step="1"

        >





        <label>
            Köder
        </label>


        <input

            id="catch-bait"

            type="text"

        >





        <label>
            Methode
        </label>


        <input

            id="catch-method"

            type="text"

        >





        <label>
            Notizen
        </label>


        <textarea

            id="catch-notes"

        ></textarea>





        <button

            id="save-catch"

            type="button"

        >

            Fang speichern

        </button>



    </div>


</section>
