<section class="waters-container">


    <h1>

        Gewässer

    </h1>





    <div class="waters-form-container">


        <h2>

            Neues Gewässer

        </h2>





        <label for="water-name">

            Name

        </label>


        <input

            type="text"

            id="water-name"

            placeholder="Gewässername"

        >





        <label for="water-type">

            Gewässertyp

        </label>


        <input

            type="text"

            id="water-type"

            placeholder="See, Fluss, Meer..."

        >





        <label for="water-country">

            Land

        </label>


        <input

            type="text"

            id="water-country"

            placeholder="Land"

        >





        <label for="water-region">

            Region

        </label>


        <input

            type="text"

            id="water-region"

            placeholder="Region"

        >





        <label for="water-lat">

            GPS Breitengrad

        </label>


        <input

            type="number"

            step="0.000001"

            id="water-lat"

        >





        <label for="water-lon">

            GPS Längengrad

        </label>


        <input

            type="number"

            step="0.000001"

            id="water-lon"

        >





        <label for="water-description">

            Beschreibung

        </label>


        <textarea

            id="water-description"

            placeholder="Beschreibung"

        ></textarea>





        <button

            id="save-water"

        >

            Speichern

        </button>



    </div>






    <div class="waters-list-container">


        <h2>

            Gespeicherte Gewässer

        </h2>




        <div id="waters-list">


            <p>

                Lade Gewässer...

            </p>


        </div>


    </div>



</section>
