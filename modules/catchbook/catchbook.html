<section class="catchbook-container">


    <h1>

        Fangbuch

    </h1>



    <div class="catchbook-controls">


        <label>

            Sortieren nach

        </label>


        <select id="catch-sort">


            <option value="newest">

                Neueste Fänge

            </option>


            <option value="oldest">

                Älteste Fänge

            </option>


            <option value="fish">

                Fischart A-Z

            </option>


            <option value="weight">

                Gewicht größter zuerst

            </option>


            <option value="length">

                Länge größter zuerst

            </option>


        </select>




        <label>

            Fisch filtern

        </label>


        <select id="catch-filter">


            <option value="">

                Alle Fische

            </option>


        </select>



    </div>



    <div id="catchbook-list">


        <p>

            Lade Fänge...

        </p>


    </div>


</section>
