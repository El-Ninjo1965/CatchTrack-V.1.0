<section
    id="waters-module"
    class="waters-module"
    aria-labelledby="waters-title"
>
    <header class="waters-header">
        <div>
            <p class="waters-eyebrow">
                CatchTrack
            </p>
            <h1 id="waters-title">
                Gewässer
            </h1>
            <p
                id="waters-status"
                class="waters-status"
                role="status"
                aria-live="polite"
            >
                Gewässer werden geladen …
            </p>
        </div>
        <button
            id="waters-refresh-button"
            class="waters-button waters-button-secondary"
            type="button"
        >
            Aktualisieren
        </button>
    </header>
    <main class="waters-content">
        <section
            class="waters-panel waters-current-panel"
            aria-labelledby="waters-current-title"
        >
            <div class="waters-panel-header">
                <div>
                    <p class="waters-section-label">
                        Standort
                    </p>
                    <h2 id="waters-current-title">
                        Gewässer in meiner Nähe
                    </h2>
                </div>
                <button
                    id="waters-gps-button"
                    class="waters-button waters-button-secondary"
                    type="button"
                >
                    Standort ermitteln
                </button>
            </div>
            <div
                id="waters-gps-status"
                class="waters-message"
                role="status"
                aria-live="polite"
            ></div>
            <div
                id="waters-nearby-list"
                class="waters-nearby-list"
                aria-live="polite"
            ></div>
        </section>
        <section
            class="waters-panel"
            aria-labelledby="waters-form-title"
        >
            <div class="waters-panel-header">
                <div>
                    <p class="waters-section-label">
                        Verwaltung
                    </p>
                    <h2 id="waters-form-title">
                        Gewässer erfassen
                    </h2>
                </div>
            </div>
            <form
                id="waters-form"
                class="waters-form"
                novalidate
            >
                <input
                    id="waters-id"
                    name="id"
                    type="hidden"
                >
                <div class="waters-form-grid">
                    <div class="waters-field waters-field-full">
                        <label for="waters-name">
                            Name
                        </label>
                        <input
                            id="waters-name"
                            name="name"
                            type="text"
                            maxlength="150"
                            autocomplete="off"
                            required
                        >
                    </div>
                    <div class="waters-field">
                        <label for="waters-type">
                            Gewässertyp
                        </label>
                        <input
                            id="waters-type"
                            name="type"
                            type="text"
                            maxlength="100"
                            autocomplete="off"
                            placeholder="z. B. Fluss, See, Kanal"
                        >
                    </div>
                    <div class="waters-field">
                        <label for="waters-country">
                            Land
                        </label>
                        <input
                            id="waters-country"
                            name="country"
                            type="text"
                            maxlength="100"
                            autocomplete="country-name"
                        >
                    </div>
                    <div class="waters-field waters-field-full">
                        <label for="waters-region">
                            Provinz / Bundesstaat / Ort
                        </label>
                        <input
                            id="waters-region"
                            name="region"
                            type="text"
                            maxlength="150"
                            autocomplete="address-level1"
                        >
                    </div>
                    <div class="waters-field waters-field-full">
                        <label for="waters-description">
                            Beschreibung
                        </label>
                        <textarea
                            id="waters-description"
                            name="description"
                            maxlength="2000"
                            rows="4"
                        ></textarea>
                    </div>
                    <div class="waters-field">
                        <label for="waters-latitude">
                            Breitengrad
                        </label>
                        <input
                            id="waters-latitude"
                            name="gps_lat"
                            type="number"
                            min="-90"
                            max="90"
                            step="any"
                            inputmode="decimal"
                        >
                    </div>
                    <div class="waters-field">
                        <label for="waters-longitude">
                            Längengrad
                        </label>
                        <input
                            id="waters-longitude"
                            name="gps_lon"
                            type="number"
                            min="-180"
                            max="180"
                            step="any"
                            inputmode="decimal"
                        >
                    </div>
                </div>
                <div
                    id="waters-form-message"
                    class="waters-message"
                    role="alert"
                    aria-live="assertive"
                ></div>
                <div class="waters-form-actions">
                    <button
                        id="waters-save-button"
                        class="waters-button waters-button-primary"
                        type="submit"
                    >
                        Gewässer speichern
                    </button>
                    <button
                        id="waters-location-button"
                        class="waters-button waters-button-secondary"
                        type="button"
                    >
                        GPS + Ort übernehmen
                    </button>
                    <button
                        id="waters-cancel-button"
                        class="waters-button waters-button-secondary"
                        type="button"
                        hidden
                    >
                        Bearbeitung abbrechen
                    </button>
                </div>
            </form>
        </section>
        <section
            class="waters-panel"
            aria-labelledby="waters-list-title"
        >
            <div class="waters-panel-header">
                <div>
                    <p class="waters-section-label">
                        Meine Daten
                    </p>
                    <h2 id="waters-list-title">
                        Meine Gewässer
                    </h2>
                </div>
                <span
                    id="waters-count"
                    class="waters-count"
                >
                    0
                </span>
            </div>
            <div
                id="waters-list"
                class="waters-list"
                aria-live="polite"
            ></div>
        </section>
    </main>
</section>
