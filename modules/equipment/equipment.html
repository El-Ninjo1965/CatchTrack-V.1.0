<section class="equipment-container">


    <h1>

        Ausrüstung

    </h1>





    <div class="equipment-form-container">


        <h2>

            Neue Ausrüstung

        </h2>




        <label for="equipment-category">

            Kategorie

        </label>


        <input

            type="text"

            id="equipment-category"

            placeholder="z.B. Rute, Rolle, Köder"

        >





        <label for="equipment-name">

            Name

        </label>


        <input

            type="text"

            id="equipment-name"

            placeholder="Name"

        >





        <label for="equipment-brand">

            Hersteller

        </label>


        <input

            type="text"

            id="equipment-brand"

            placeholder="Hersteller"

        >





        <label for="equipment-model">

            Modell

        </label>


        <input

            type="text"

            id="equipment-model"

            placeholder="Modell"

        >





        <label for="equipment-description">

            Beschreibung

        </label>


        <textarea

            id="equipment-description"

            placeholder="Beschreibung"

        ></textarea>





        <button

            id="save-equipment"

        >

            Speichern

        </button>



    </div>






    <div class="equipment-list-container">


        <h2>

            Gespeicherte Ausrüstung

        </h2>




        <div id="equipment-list">


            <p>

                Lade Ausrüstung...

            </p>


        </div>


    </div>



</section>
